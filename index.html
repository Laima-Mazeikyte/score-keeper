<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ranchers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="content-wrap">
    <header class="page-header">
      <h1 class="title-rainbow" aria-label="Game night">
        <span style="color: var(--blue-200)">G</span><span style="color: var(--secondary-5)">a</span><span style="color: var(--secondary-7)">m</span><span style="color: var(--secondary-11)">e</span><span> </span><span style="color: var(--secondary-6)">N</span><span style="color: var(--secondary-8)">i</span><span style="color: var(--secondary-4)">g</span><span style="color: var(--blue-200)">h</span><span style="color: var(--secondary-5)">t</span>
      </h1>
      <div class="header-actions">
        <button type="button" class="btn-tertiary" id="btn-add-player">+ Add player</button>
        <div class="default-score-slot" id="default-score-slot">
          <div class="starting-score-wrap">
            <div class="starting-score-display btn-tertiary" id="starting-score-display" tabindex="0" role="button" aria-label="Starting score">Starting score: 0</div>
            <input type="text" class="starting-score-input btn-tertiary" id="starting-score-input" value="0" inputmode="numeric" pattern="[0-9]*" aria-label="Starting score" maxlength="4" hidden>
          </div>
        </div>
        <button type="button" class="btn-tertiary btn-fullscreen-icon" id="btn-fullscreen" aria-label="Full screen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </header>
    <div class="players-container" id="players-container">
      <div class="players-grid" id="players-grid">
      <section id="player-1" class="player-card" data-card-color="1">
        <div class="player-name-row">
          <input type="text" id="player-1-name" class="player-name" data-player="player-1" value="Sardine Player" placeholder="Edit name" aria-label="Player 1 name" maxlength="30" autocomplete="off">
        </div>
        <div class="score-controls">
          <button type="button" class="btn-secondary score-btn btn-decrement" data-player="player-1" aria-label="Decrease score">−</button>
          <div id="player-1-score" class="score" contenteditable="true" data-player="player-1">0</div>
          <button type="button" class="btn-secondary score-btn btn-increment" data-player="player-1" aria-label="Increase score">+</button>
        </div>
        <button type="button" class="btn-remove" data-player="player-1" aria-label="Remove player">Remove</button>
      </section>

      <section id="player-2" class="player-card" data-card-color="2">
        <div class="player-name-row">
          <input type="text" id="player-2-name" class="player-name" data-player="player-2" value="Eggplant Player" placeholder="Edit name" aria-label="Player 2 name" maxlength="30" autocomplete="off">
        </div>
        <div class="score-controls">
          <button type="button" class="btn-secondary score-btn btn-decrement" data-player="player-2" aria-label="Decrease score">−</button>
          <div id="player-2-score" class="score" contenteditable="true" data-player="player-2">0</div>
          <button type="button" class="btn-secondary score-btn btn-increment" data-player="player-2" aria-label="Increase score">+</button>
        </div>
        <button type="button" class="btn-remove" data-player="player-2" aria-label="Remove player">Remove</button>
      </section>
      </div>
      <div class="add-player-footer" id="add-player-footer">
        <button type="button" class="btn-add-player-subtle" id="btn-add-player-footer" aria-label="Add player">+</button>
      </div>
    </div>
  </div>

  <footer class="page-footer" aria-label="Credits">
    Build with Cursor by <a href="https://laima.design/">https://laima.design/</a>
  </footer>

  <!-- Reset score: fixed bottom-right -->
  <button type="button" class="btn-tertiary btn-reset-score-fixed" id="btn-reset-score" aria-label="Reset score">Reset score</button>

  <!-- Exit full-screen (visible only in fullscreen mode) -->
  <button type="button" class="btn-exit-fullscreen btn-tertiary" id="btn-exit-fullscreen" aria-label="Exit full screen">Exit full screen</button>

  <!-- Fullscreen bottom bar: visible in fullscreen only; hover near bottom to show -->
  <div class="fs-bottom-bar is-visible" id="fs-bottom-bar" aria-hidden="true">
    <div class="fs-bottom-bar__indicator" aria-hidden="true"></div>
    <div class="fs-bottom-bar__menu">
      <button type="button" class="fs-bottom-bar__btn btn-tertiary" id="fs-bar-add-player" aria-label="Add player">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="fs-bottom-bar__btn btn-tertiary" id="fs-bar-starting-score" aria-label="Starting score">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>
      </button>
      <button type="button" class="fs-bottom-bar__btn btn-tertiary" id="fs-bar-reset-score" aria-label="Reset score">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button type="button" class="fs-bottom-bar__btn btn-tertiary" id="fs-bar-exit-fullscreen" aria-label="Exit full screen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 8h3a2 2 0 0 1 2 2v3"/></svg>
      </button>
    </div>
  </div>

  <!-- Reset score confirmation modal -->
  <div id="reset-modal-backdrop" class="modal-backdrop" hidden aria-hidden="true">
    <div id="reset-modal" class="modal-dialog" role="alertdialog" aria-labelledby="reset-modal-title" aria-describedby="reset-modal-desc">
      <h2 id="reset-modal-title" class="modal-title">Reset all scores?</h2>
      <p id="reset-modal-desc" class="modal-desc">Everyone goes back to the starting score. No take-backs!</p>
      <div class="modal-actions">
        <button type="button" class="btn-tertiary modal-btn-confirm" id="reset-modal-confirm">Reset scores</button>
        <button type="button" class="btn-tertiary modal-btn-cancel" id="reset-modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
